<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — VedicAstro</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<nav class="nav">
  <div class="nav__row">
    <a href="index.html" class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="#e3ab48" stroke-width="1.2"/><path d="M16 5 L26 16 L16 27 L6 16 Z" fill="none" stroke="#e3ab48" stroke-width="1.2"/><circle cx="16" cy="16" r="2.2" fill="#e3ab48"/></svg>
      Vedic<span>Astro</span>
    </a>
    <button class="nav__toggle" aria-label="Toggle menu">☰</button>
    <div class="nav__links">
      <a href="index.html">Home</a>
    </div>
    <div class="nav__cta">
      <a href="signin.html" class="btn btn--ghost btn--sm">Sign In</a>
    </div>
  </div>
</nav>

<section class="auth-shell wrap">
  <div class="auth-card card reveal">
    <p class="eyebrow" style="justify-content:center; margin-bottom:8px;">Password reset</p>
    <h1>Set a new password</h1>
    <p class="auth-sub" id="resetSub">Choose a new password for your account.</p>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--gold btn--block" id="resetSubmit">Reset Password</button>
      <p class="auth-note" id="resetNote"></p>
    </form>

    <p class="auth-switch" id="resetSwitch" style="display:none;">
      <a href="signin.html">Go to Sign In →</a>
    </p>
  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <div class="footer__bottom" style="border-top:none; padding-top:0;">
      <span>© <span data-year></span> VedicAstro. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/app.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
